<!doctype html>
<html lang="{{ luxury_lang }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}LuxuryShop{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body.theme-dark {
			background: #111827 !important;
			color: #f9fafb;
		}
		body.theme-dark .card,
		body.theme-dark .form-control {
			background: #1f2937;
			color: #f9fafb;
			border-color: #374151;
		}
		.preference-bar {
			position: absolute;
			top: 12px;
			right: 12px;
			z-index: 10;
		}
		.preference-bar .form-select,
		.preference-bar .btn {
			width: auto;
			min-width: 84px;
		}
	</style>
</head>
<body class="bg-light theme-{{ luxury_theme }}">
	<form class="preference-bar d-flex gap-2" method="POST" action="{{ url_for('set_preferences') }}">
		<input type="hidden" name="next" value="{{ request.full_path }}">
		<select class="form-select form-select-sm" name="lang" aria-label="Language">
			<option value="vi" {% if luxury_lang == 'vi' %}selected{% endif %}>VI</option>
			<option value="en" {% if luxury_lang == 'en' %}selected{% endif %}>EN</option>
		</select>
		<select class="form-select form-select-sm" name="theme" aria-label="Theme">
			<option value="light" {% if luxury_theme == 'light' %}selected{% endif %}>Light</option>
			<option value="dark" {% if luxury_theme == 'dark' %}selected{% endif %}>Dark</option>
		</select>
		<button class="btn btn-sm btn-dark" type="submit">OK</button>
	</form>
	<main>
		{% block content %}{% endblock %}
	</main>
</body>
</html>
