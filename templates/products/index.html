{% extends 'base.html' %}
{% block title %}Sản phẩm — LuxuryShop{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="p-4 p-md-5 bg-white border rounded-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h3 class="fw-bold mb-2">Trang sản phẩm</h3>
        <p class="text-muted mb-0">Xin chào {{ kh.HoTen }}, bạn đã đăng nhập thành công.</p>
      </div>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-dark btn-sm">
        Đăng xuất
      </a>
    </div>
    <div class="alert alert-success mb-0">
      Đây là trang đích sau khi đăng nhập. Bạn có thể tiếp tục thêm danh sách sản phẩm ở đây.
    </div>
  </div>
</div>
{% endblock %}
