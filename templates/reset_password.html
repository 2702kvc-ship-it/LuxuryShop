{% extends 'base.html' %}
{% block title %}Đặt lại mật khẩu — LuxuryShop{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <h3 class="fw-bold mb-4 text-center">Đặt lại mật khẩu</h3>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Mật khẩu mới</label>
      <input type="password" name="mat_khau_moi" class="form-control"
             minlength="6" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">Xác nhận mật khẩu mới</label>
      <input type="password" name="xac_nhan_mat_khau" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Xác nhận</button>
  </form>
</div>
{% endblock %}
